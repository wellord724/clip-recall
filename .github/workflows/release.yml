name: Build macOS release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          swift --version
          swift test
      - name: Build and verify app
        shell: zsh {0}
        run: |
          set -euo pipefail
          zsh Scripts/build-app.sh
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)" = '0.1.0'
          lipo ClipboardApp.app/Contents/MacOS/ClipboardApp -verify_arch '${{ matrix.arch }}'
          codesign --verify --deep --strict --verbose=2 ClipboardApp.app
          plutil -lint ClipboardApp.app/Contents/Info.plist
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent ClipboardApp.app 'dist/ClipRecall-v0.1.0-macos-${{ matrix.arch }}.zip'
          unzip -t 'dist/ClipRecall-v0.1.0-macos-${{ matrix.arch }}.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: dist
          merge-multiple: true
      - name: Prepare source and checksums
        run: |
          git archive --format=zip --prefix=ClipRecall-v0.1.0/ HEAD -o dist/ClipRecall-v0.1.0-source.zip
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<'EOF'
          ClipRecall 0.1.0 — macOS 剪贴板历史与顺序粘贴。

          ## 下载与安装
          - Apple Silicon（M 系列）：下载 `ClipRecall-v0.1.0-macos-arm64.zip`。
          - Intel Mac：下载 `ClipRecall-v0.1.0-macos-x86_64.zip`。
          - 需要 macOS 14 或更高版本；解压后将 `ClipboardApp.app` 拖入“应用程序”。
          - 首次运行若被系统阻止，请在“系统设置 → 隐私与安全性”中允许打开。
          - 按序粘贴需要在“隐私与安全性 → 辅助功能”中授权。

          ## 源码与验证
          - `ClipRecall-v0.1.0-source.zip` 是本次构建对应提交的完整受版本控制源码。
          - `SHA256SUMS.txt` 包含所有 ZIP 文件的 SHA-256 校验值。
          - 两种架构均通过现有测试、Release 编译、架构检查和临时代码签名验证。
          - 应用采用 ad-hoc 签名，未使用 Apple Developer ID 签名或 Apple 公证。
          - 历史记录和收集序列仅保存在内存中，退出应用后会清空。
          EOF
          gh release create v0.1.0 dist/* --target "$GITHUB_SHA" --title 'ClipRecall v0.1.0' --notes-file release-notes.md --draft
          gh release edit v0.1.0 --draft=false
